<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="100%" stop-color="#09090D" />
    </linearGradient>

    <!-- Main Accent Gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box Body -->
  <rect x="16" y="16" width="480" height="480" rx="138.2" ry="138.2" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner Dynamic Icon Graphics -->
  <g filter="url(#glow)">
    
                    <!-- Background TV Screen Outline -->
                    <rect x="112" y="132" width="288" height="248" rx="40" fill="#0A0A0E" stroke="#e11d48" stroke-width="6" opacity="0.8"/>
                    
                    <!-- MPV Player Center Ring -->
                    <circle cx="256" cy="256" r="90" fill="url(#mainGrad)" />
                    
                    <!-- Play Symbol White -->
                    <polygon points="236,210 236,302 300,256" fill="#FFFFFF" />
                    
                    <!-- MPV Top-right Chevron Badge -->
                    <path d="M 350 120 L 380 120 L 400 150 L 380 180 L 350 180 Z" fill="#2563eb" />
                    <text x="367" y="156" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle">MPV</text>
                
  </g>
</svg>