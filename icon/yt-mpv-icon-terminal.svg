<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="100%" stop-color="#09090D" />
    </linearGradient>

    <!-- Main Accent Gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box Body -->
  <rect x="16" y="16" width="480" height="480" rx="138.2" ry="138.2" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner Dynamic Icon Graphics -->
  <g filter="url(#glow)">
    
                    <!-- Terminal Prompt Brackets -->
                    <path d="M 140 160 L 90 256 L 140 352" fill="none" stroke="#e11d48" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
                    
                    <!-- Central Neon Play Arrow -->
                    <polygon points="220,150 220,362 380,256" fill="url(#mainGrad)" />
                    
                    <!-- Bottom Terminal Cursor Dot line -->
                    <line x1="220" y1="400" x2="360" y2="400" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
                
  </g>
</svg>