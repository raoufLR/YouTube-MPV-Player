[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-mpv-player"
dynamic = ["version"]
description = "A lightweight, privacy-focused desktop YouTube player powered by MPV and yt-dlp."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyQt6==6.11.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pyinstaller==6.22.3",
    "ruff==0.17.2",
]

[project.scripts]
youtube-mpv-player = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "player",
    "version",
    "youtube_api",
    "youtube_video_player",
]

[tool.setuptools.packages.find]
include = ["app*", "core*", "models*", "services*", "ui*"]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not live and not network'"
markers = [
    "live: tests that contact YouTube or another external service",
    "network: tests that require network access",
    "qt: tests that require a Qt application instance",
    "slow: tests that take more than a few seconds",
]
filterwarnings = [
    "default",
]

[tool.coverage.run]
branch = true
source = ["app", "core", "models", "services", "player", "youtube_api", "main"]
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Expanded rules for higher code quality
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = ["E501"]
